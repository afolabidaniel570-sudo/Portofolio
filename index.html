    <script>
      (function () {
        var EXT_PROTOCOL_RE = /(?:chrome|moz|safari)-extension:\/\//i;
        function isExtensionError(source, err) {
          var stack = err && typeof err.stack === 'string' ? err.stack : '';
          return (
            (typeof source === 'string' && EXT_PROTOCOL_RE.test(source)) ||
            EXT_PROTOCOL_RE.test(stack)
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            if (isExtensionError(event.filename, event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            if (isExtensionError('', reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var proto = typeof Window !== 'undefined' ? Window.prototype : Object.getPrototypeOf(window);
          var protoDesc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : undefined;
          var activeDesc = ownDesc || protoDesc;

          if (
            typeof window.fetch === 'function' &&
            activeDesc &&
            activeDesc.get &&
            !activeDesc.set &&
            (!ownDesc || ownDesc.configurable)
          ) {
            var nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return nativeFetch;
              },
              set: function () {
                // Prevent TypeError when injected browser extensions attempt `window.fetch = ...`
              },
            });
          }
        } catch (_) {
          // Ignore if the runtime locks window.fetch as non-configurable
        }
      })();
    </script>
